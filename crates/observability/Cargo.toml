[package]
name = "sentinel-observability"
description = "Tracing, metrics, redaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sentinel-domain = { workspace = true }
sentinel-config = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
# OpenTelemetry stack — non-optional so `cargo check --workspace` (CI) actually
# compiles the exporter instead of hiding a broken gated path. Runtime export
# is enabled only when a real OTLP endpoint is configured (see init_telemetry);
# when no endpoint is set, only stdout JSON tracing is active (LOCAL/CI).
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "tls", "tls-roots"] }
tracing-opentelemetry = "0.28"
serde_json.workspace = true

[features]
# Kept for backward compatibility with existing config/Dockerfiles that reference
# it; the exporter is now always compiled and gated at runtime instead.
cloud-trace = []
